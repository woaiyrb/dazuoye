server:
  port: ${JAVA_API_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: mark-api-java
  datasource:
    url: ${JAVA_DATABASE_URL:jdbc:mysql://127.0.0.1:6001/mark?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${JAVA_DATABASE_USERNAME:mark}
    password: ${JAVA_DATABASE_PASSWORD:markpassword}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 6
      minimum-idle: 1
      connection-timeout: 5000
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: "0"
    locations: classpath:db/migration
    validate-on-migrate: false
  lifecycle:
    timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info

mark:
  pid-file: ${JAVA_API_PID_FILE:}
  cors:
    allowed-origins: ${JAVA_CORS_ORIGINS:http://localhost:3010,http://127.0.0.1:3010,http://localhost:3020,http://127.0.0.1:3020,http://localhost:3030,http://127.0.0.1:3030}
  deeptutor:
    base-url: ${DEEPTUTOR_BASE_URL:http://127.0.0.1:8001}
    api-key: ${DEEPTUTOR_API_KEY:}
    timeout-seconds: ${DEEPTUTOR_TIMEOUT_SECONDS:300}
